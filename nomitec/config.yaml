backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "packages"
    label: "CCTV Packages"
    folder: "packages"
    create: true
    fields:
      - { label: "Package Name", name: "title", widget: "string" }
      - { label: "Short Description", name: "description", widget: "string" }
      - { label: "Package Image", name: "image", widget: "image" }
      - { label: "Features", name: "features", widget: "list", field: { label: "Feature", name: "feature", widget: "string" } }
      - { label: "WhatsApp Message", name: "whatsapp_msg", widget: "string", default: "I'm interested in this package" }

  - name: "services"
    label: "Our Services"
    folder: "services"
    create: true
    fields:
      - { label: "Service Name", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Icon", name: "icon", widget: "select", options: ["fa-video", "fa-phone-volume", "fa-bell", "fa-tools", "fa-desktop", "fa-plug", "fa-network-wired", "fa-shopping-cart", "fa-clock"] }

  - name: "faq"
    label: "FAQ Questions"
    folder: "faq"
    create: true
    fields:
      - { label: "Question", name: "question", widget: "string" }
      - { label: "Answer", name: "answer", widget: "text" }

  - name: "settings"
    label: "Site Settings"
    files:
      - label: "General Settings"
        name: "general"
        file: "site-settings.yml"
        fields:
          - { label: "Phone Number", name: "phone", widget: "string" }
          - { label: "Email 1", name: "email1", widget: "string" }
          - { label: "Email 2", name: "email2", widget: "string" }
          - { label: "Address", name: "address", widget: "text" }
          - { label: "WhatsApp Channel", name: "whatsapp_channel", widget: "string" }
