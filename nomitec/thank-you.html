<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - NomiTec</title>
   <link rel="icon" type="image/png" href="images/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #00a8e8;
            --dark-blue: #0077b6;
            --light-blue: #90e0ef;
            --green: #06d6a0;
            --bg-body: #ffffff;
            --text-primary: #2d3436;
            --text-secondary: #636e72;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #16213e 0%, #0077b6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
        }

        .thank-you-container {
            text-align: center;
            max-width: 700px;
            padding: 60px 40px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .checkmark {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, var(--green), var(--light-blue));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            animation: scaleIn 0.5s ease;
            box-shadow: 0 10px 30px rgba(6, 214, 160, 0.4);
        }

        .checkmark i {
            font-size: 60px;
            color: white;
        }

        @keyframes scaleIn {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        h1 {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 20px;
            color: white;
        }

        .message {
            font-size: 22px;
            margin-bottom: 15px;
            opacity: 0.95;
            line-height: 1.6;
        }

        .sub-message {
            font-size: 18px;
            margin-bottom: 40px;
            opacity: 0.85;
            color: var(--light-blue);
        }

        .contact-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .contact-info p {
            font-size: 16px;
            margin-bottom: 10px;
        }

        .contact-info a {
            color: var(--light-blue);
            text-decoration: none;
            font-weight: 600;
            font-size: 20px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
        }

        .contact-info a:hover {
            color: var(--green);
            transform: scale(1.05);
        }

        .btn {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary-blue), var(--dark-blue));
            color: white;
            padding: 16px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: 0.3s;
            box-shadow: 0 10px 30px rgba(0, 168, 232, 0.4);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0, 168, 232, 0.5);
        }

        .logo {
            margin-bottom: 30px;
        }

        .logo h2 {
            font-size: 36px;
            font-weight: 800;
            color: white;
        }

        .logo span {
            font-size: 14px;
            color: var(--light-blue);
            display: block;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            h1 { font-size: 36px; }
            .message { font-size: 18px; }
            .checkmark { width: 100px; height: 100px; }
            .checkmark i { font-size: 50px; }
        }
    </style>
</head>
<body>
    <div class="thank-you-container">
        <div class="logo">
            <h2>NomiTec</h2>
            <span>Our Security is Your Peace of Mind.</span>
        </div>

        <div class="checkmark">
            <i class="fas fa-check"></i>
        </div>

        <h1>Thank You!</h1>
        
        <p class="message">Thank you for choosing NomiTec</p>
        <p class="sub-message">Our agent will call you soon</p>

        <div class="contact-info">
            <p style="margin-bottom: 15px; opacity: 0.9;">Need immediate assistance?</p>
            <a href="tel:03293985470">
                <i class="fas fa-phone-alt"></i>
                Call us: 0329-3985470
            </a>
        </div>

        <a href="/" class="btn">
            <i class="fas fa-home"></i> Go Back to Home
        </a>
    </div>
</body>
</html>
